name: Pull request entries

# The base branch judges a pull request: pull_request_target runs this file as it is on the base
# branch, whose tools, policy data and schemas are checked out; the pull request's head is checked
# out beside them as data only, and only the files of the entries it adds, changes or removes are
# taken over, links copied as links, never followed, with the policy exceptions it grants for them,
# which a code owner approves (none is taken while the base branch names no code owner of the
# policy data). No code of the pull request runs. The token is read-only and no
# secret is used, so a pull request from a fork is judged the same way. Its other changes (tools,
# policy, schemas) are the tools CI's.
on:  # zizmor: ignore[dangerous-triggers] -- the pull request is read as data, never run
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-entries-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  entries:
    name: Pull request entries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check out the pull request, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install the base branch's tools
        run: uv sync --frozen --no-dev

      - name: Take the changed entries from the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev scenario-tools changed-entries pull --base "$BASE" > "$RUNNER_TEMP/changed"
          : > "$RUNNER_TEMP/entries"
          mkdir -p -- "$RUNNER_TEMP/previous"
          while IFS= read -r -d '' entry; do
            # Never a place outside the catalogue, whatever lists it.
            case "/$entry/" in
              */../*|*/./*|*//*) echo "refused, outside the catalogue: $entry" >&2; exit 1 ;;
            esac
            case "$entry" in
              scenarios|scenarios/*) ;;
              *) echo "refused, outside the catalogue: $entry" >&2; exit 1 ;;
            esac
            # The base's copy is the entry's previous version, kept for the version checks.
            if [ -e "$entry" ] && [ ! -L "$entry" ]; then
              case "$entry" in */*) mkdir -p -- "$RUNNER_TEMP/previous/${entry%/*}" ;; esac
              cp -P -R -- "$entry" "$RUNNER_TEMP/previous/$entry"
            fi
            rm -rf -- "$entry"  # removed or changed: the base's copy goes
            if [ -e "pull/$entry" ] || [ -L "pull/$entry" ]; then
              case "$entry" in */*) mkdir -p -- "${entry%/*}" ;; esac
              cp -P -R -- "pull/$entry" "$entry"
              printf '%s\0' "$entry" >> "$RUNNER_TEMP/entries"
            fi
          done < "$RUNNER_TEMP/changed"

      - name: Take the pull request's policy exceptions
        run: |
          set -euo pipefail
          # Granted with the entry they cover, reviewed in the same diff; a code owner approves
          # them before the merge, so none is taken while the base branch names no code owner.
          exceptions=policy/data/exceptions.yaml
          for part in pull/policy pull/policy/data "pull/$exceptions"; do
            if [ -L "$part" ]; then echo "refused, a link: $part" >&2; exit 1; fi
          done
          if [ ! -e "pull/$exceptions" ]; then
            echo "The pull request has no policy exceptions: the base branch's are kept." \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f "pull/$exceptions" ]; then
            echo "refused, not a regular file: pull/$exceptions" >&2
            exit 1
          elif ! cmp -s -- "pull/$exceptions" "$exceptions"; then
            # A rule of the base branch's code owners for the policy data, the registry or above.
            owners='^/policy/(data/(exceptions\.yaml)?)?[[:space:]]+@'
            if [ ! -f .github/CODEOWNERS ] || [ -L .github/CODEOWNERS ] \
              || ! grep -qE "$owners" .github/CODEOWNERS; then
              echo "refused: the pull request changes the policy exceptions, and no code owner can approve them yet" >&2
              exit 1
            fi
            cp -- "pull/$exceptions" "$exceptions"
            echo "::warning file=$exceptions::the pull request changes the policy exceptions: a code owner approves each one before the merge"
            echo "The pull request changes the policy exceptions: a code owner approves each one before the merge." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate the changed entries
        run: |
          set -euo pipefail
          mapfile -d '' entries < "$RUNNER_TEMP/entries"
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "No entry is added or changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          uv run --frozen --no-dev scenario-tools validate --previous-root "$RUNNER_TEMP/previous" \
            -- "${entries[@]}" > "$RUNNER_TEMP/findings" 2>&1 || status=$?
          {
            echo "## Entries"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/findings"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/findings"
          exit "$status"

      - name: Install gitleaks (pinned, checksum verified)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Look for secrets in the changed entries
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r -d '' entry; do  # every entry, whatever the one before found
            # The scan reads an ignore file at the root it scans: an entry's never hides anything.
            while IFS= read -r -d '' ignore; do
              echo "refused, an ignore file: $ignore" >&2
              rm -rf -- "$ignore"
              status=1
            done < <(find "$entry" -name .gitleaksignore -print0)
            "$RUNNER_TEMP/gitleaks" dir --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
              --ignore-gitleaks-allow --max-archive-depth 2 --no-banner --redact -- "$entry" \
              || status=1
          done < "$RUNNER_TEMP/entries"
          if [ "$status" -ne 0 ]; then
            echo "A secret scan found something in the entries: CONTRIBUTING.md says what to do." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Look for secrets in the pull request's commits
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Every commit the pull request brings, not only its last tree: a merge keeps them all,
          # a secret a later commit removes included, and a merge's own changes are read too.
          # Read through its git directory, so that no file of the pull request, an ignore file
          # say, is read as the scan's configuration. A range it cannot read fails, never passes.
          for commit in "$BASE" "$HEAD"; do
            if ! git -C pull rev-parse --quiet --verify "$commit^{commit}" > /dev/null; then
              echo "refused, not a commit of the pull request's clone: $commit" >&2
              exit 1
            fi
          done
          status=0
          "$RUNNER_TEMP/gitleaks" git --config "$GITHUB_WORKSPACE/.gitleaks.toml" \
            --ignore-gitleaks-allow --max-archive-depth 2 --no-banner --redact \
            --log-opts="--diff-merges=first-parent $BASE..$HEAD" -- pull/.git || status=$?
          if [ "$status" -ne 0 ]; then
            echo "A secret scan found something in the commits: CONTRIBUTING.md says what to do." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
