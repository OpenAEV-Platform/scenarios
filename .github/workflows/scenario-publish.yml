name: Scenario publish

# The last mile of the scenario publishing pipeline. The Publisher agent exports
# the scenario itself and commits .scenario-publish/export.zip and
# .scenario-publish/request.yaml to a scenario-publish/* branch, then opens a
# draft pull request. This workflow runs the real scenario-tools (intake, then
# validate) on the committed export, removes the staging files, and commits the
# entry. It never calls the OpenAEV platform. The pull request's pr-entries,
# pr-title and Tools CI then judge the entry as for any contributor.
#
# It runs ONLY on scenario-publish/* branches. The only secret is the
# filigran-automation token (in the protected "scenario-publish" environment):
# its commit, unlike GITHUB_TOKEN's, triggers the pull request's checks, and the
# author is the bot, not a person. A run that finds no staging file (the entry
# commit, or a hand-pushed branch) does nothing.
on:
  push:
    branches: ["scenario-publish/**"]

permissions:
  contents: read

concurrency:
  group: scenario-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Materialise and commit the entry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: scenario-publish
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # the entry commit goes through the API with the bot token

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install the tools
        run: uv sync --frozen --no-dev

      - name: Materialise the entry and commit it
        env:
          # The bot token: its commit triggers the pull request's checks (a
          # GITHUB_TOKEN commit does not), and keeps the author off a real person.
          FILIGRAN_AUTOMATION_TOKEN: ${{ secrets.FILIGRAN_AUTOMATION_TOKEN }}
        run: uv run --frozen --no-dev python scripts/scenario_publish.py
