name: Scenario publish

# The last mile of the scenario publishing pipeline. The Publisher agent exports
# the scenario itself, with its lab targets already neutralised, commits
# .scenario-publish/export.zip and .scenario-publish/request.yaml to a
# scenario-publish/* branch, then opens a draft pull request. This workflow runs
# the real scenario-tools (intake, then validate) on that export, and commits the
# entry in place of the staging files. It never calls the OpenAEV platform. The
# pull request's pr-entries, pr-title and Tools CI then judge the entry as for
# any contributor.
#
# The base branch runs it: pull_request_target runs this file, the script and the
# tools as they are on the base branch; the pull request's head is checked out
# beside them as data only (its staging files), and no code of the pull request
# runs, so whoever can push a branch cannot change what gets the token. It acts
# only on a pull request the bot opened from a scenario-publish/* branch of this
# repository, on an event the bot caused. The only secret is the key of the
# publish app (in the protected "scenario-publish" environment), for a token that
# can only write this repository's contents and lasts an hour: its commit, unlike
# GITHUB_TOKEN's, triggers the pull request's checks, and its author is the app,
# not a person. That commit's event comes from the app, not the bot, so it starts
# no new run, and a run that finds no staging file does nothing.
on:  # zizmor: ignore[dangerous-triggers] -- the pull request is read as data, never run
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: scenario-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    name: Materialise and commit the entry
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'scenario-publish/')
      && github.event.pull_request.user.login == 'Filigran-Automation'
      && github.event.sender.login == 'Filigran-Automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: scenario-publish
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false  # the entry commit goes through the API with the app token

      - name: Check out the pull request's staging files, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull
          sparse-checkout: .scenario-publish
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install the base branch's tools
        run: uv sync --frozen --no-dev

      - name: Take a token of the publish app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Materialise the entry and commit it
        env:
          # The app token: its commit triggers the pull request's checks (a
          # GITHUB_TOKEN commit does not), and keeps the author off a real person.
          PUBLISH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --frozen --no-dev python scripts/scenario_publish.py
