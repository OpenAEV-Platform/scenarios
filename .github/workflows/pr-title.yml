name: Pull request title

# pull_request_target runs this file and the checker as they are on the base branch, so a pull
# request cannot change the check that judges it. The pull request's code is never checked out:
# only its title is read, through an environment variable. The token is read-only and no secret
# is used.
on:  # zizmor: ignore[dangerous-triggers] -- only the title is read, never the pull request's code
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # "--" ends the options: a title such as "--help" is still read as a title.
        run: uv run --frozen --no-dev scenario-tools check-title -- "$TITLE"
