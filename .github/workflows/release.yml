name: Release

# Builds the release of the catalogue twice, on two runners, from the same commit, against the
# channel's previous release, and compares the two byte for byte: a release is what its commit
# gives, wherever it is built. Then it publishes it: the one who starts the run approves the
# release, which names them as its approver, and the channel's pointer moves to it. Run by hand,
# on the default branch only. What the tools write stays in the runner's temporary directory, never in the checkout.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to publish the release on (stable comes with promotion)
        type: choice
        options: [edge]
        default: edge

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  approvals:
    name: Approvals of every entry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that reads more than the code: the pull requests and their reviews, read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Build from the default branch only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Compared by the shell, as git names refs: case counts, where an expression ignores it.
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "A release is built from the default branch, whose changes were reviewed."
            exit 1
          fi

      - name: Read the channel's previous release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          export LC_ALL=C
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${default}" --jq .commit.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "A release is built from the head of the default branch, $head, not $GITHUB_SHA."
            exit 1
          fi
          mkdir "$RUNNER_TEMP"/previous
          if answer=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${CHANNEL}.json?ref=channels" 2> "$RUNNER_TEMP"/previous/error.txt); then
            sha=$(printf '%s' "$answer" | jq -r .sha)
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The pointer of $CHANNEL is not as GitHub gives a file."
              exit 1
            fi
            printf '%s' "$sha" > "$RUNNER_TEMP"/previous/pointer.sha
            printf '%s' "$answer" | jq -r .content | base64 -d > "$RUNNER_TEMP"/previous/pointer.json
            release=$(jq -r .release "$RUNNER_TEMP"/previous/pointer.json)
            if ! [[ "$release" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]{0,8}|[1-9][0-9]{0,2}\.[0-9]{6}\.(0|[1-9][0-9]{0,8}))$ ]]; then
              echo "The pointer of $CHANNEL names no release."
              exit 1
            fi
            gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP"/previous
          elif grep -q "Not Found (HTTP 404)" "$RUNNER_TEMP"/previous/error.txt; then
            count=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq length)
            if [ "$count" != "0" ]; then
              echo "The repository has a release, but $CHANNEL has no pointer: restore it before releasing again."
              exit 1
            fi
            echo "The channel has no release yet." > "$RUNNER_TEMP"/previous/first-release
          else
            cat "$RUNNER_TEMP"/previous/error.txt
            exit 1
          fi
          rm "$RUNNER_TEMP"/previous/error.txt

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the last commit that changed each entry
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Check the previous release against the channel's pointer
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -f "$RUNNER_TEMP"/previous/pointer.json ]; then
            uv run --frozen --no-dev scenario-tools channel previous --pointer "$RUNNER_TEMP"/previous/pointer.json --manifest "$RUNNER_TEMP"/previous/manifest.json --channel "$CHANNEL"
          fi

      - name: Collect the approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-dev scenario-tools approvals --repo . --out "$RUNNER_TEMP"/approvals.json

      - name: Keep the approvals for the builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approvals
          path: ${{ runner.temp }}/approvals.json
          if-no-files-found: error
          retention-days: 7

      - name: Keep the previous release for the builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous
          path: ${{ runner.temp }}/previous
          if-no-files-found: error
          retention-days: 7

  # Two jobs, the same but for the name of what they keep, rather than a matrix: an expression
  # is given to an action only to name a commit. A test keeps them the same.
  build-one:
    name: Build, first runner
    needs: approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the approvals
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approvals
          path: ${{ runner.temp }}/inputs

      - name: Take the previous release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous
          path: ${{ runner.temp }}/previous

      - name: Build the release
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          previous=none
          if [ -f "$RUNNER_TEMP"/previous/manifest.json ]; then
            previous="$RUNNER_TEMP"/previous/manifest.json
          fi
          uv run --frozen --no-dev scenario-tools build --repo . --previous-release "$previous" --channel "$CHANNEL" --approvals "$RUNNER_TEMP"/inputs/approvals.json --out "$RUNNER_TEMP"/release

      - name: Keep the release built
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-one
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  build-two:
    name: Build, second runner
    needs: approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the approvals
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approvals
          path: ${{ runner.temp }}/inputs

      - name: Take the previous release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous
          path: ${{ runner.temp }}/previous

      - name: Build the release
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          previous=none
          if [ -f "$RUNNER_TEMP"/previous/manifest.json ]; then
            previous="$RUNNER_TEMP"/previous/manifest.json
          fi
          uv run --frozen --no-dev scenario-tools build --repo . --previous-release "$previous" --channel "$CHANNEL" --approvals "$RUNNER_TEMP"/inputs/approvals.json --out "$RUNNER_TEMP"/release

      - name: Keep the release built
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-two
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  compare:
    name: The two builds are the same bytes, and the release is verified
    needs: [build-one, build-two]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the first build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-one
          path: ${{ runner.temp }}/one

      - name: Take the second build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-two
          path: ${{ runner.temp }}/two

      - name: Compare them byte for byte
        run: |
          diff --recursive --brief --no-dereference "$RUNNER_TEMP"/one "$RUNNER_TEMP"/two
          echo "The two builds are the same: $(find "$RUNNER_TEMP/one" -type f | wc -l) files." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the release as its consumers will
        run: uv run --frozen --no-dev scenario-tools verify "$RUNNER_TEMP"/one/manifest.json --schemas schemas

  publish:
    name: Approve and publish the release, then move the channel to it
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that writes: the release, and the channel's pointer on the channels branch.
    # The pointer is written with a token of the release app, the one writer of channels; its key
    # is kept in the release environment, which only the default branch can deploy to.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the release built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-one
          path: ${{ runner.temp }}/release

      - name: Take the previous release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: previous
          path: ${{ runner.temp }}/previous

      # The release environment asks for no reviewer: starting the run is the approval, and the
      # one who started it is the release approver.
      - name: Approve the release
        env:
          APPROVER: ${{ github.triggering_actor }}
        run: |
          approver=$(printf '%s' "$APPROVER" | tr '[:upper:]' '[:lower:]')
          uv run --frozen --no-dev scenario-tools approve "$RUNNER_TEMP"/release/manifest.json --approver "$approver" --out "$RUNNER_TEMP"/approved
          mv "$RUNNER_TEMP"/approved/manifest.json "$RUNNER_TEMP"/release/manifest.json

      - name: Verify the approved release as its consumers will
        run: uv run --frozen --no-dev scenario-tools verify "$RUNNER_TEMP"/release/manifest.json --schemas schemas --approved

      - name: Write the channel's next pointer
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          previous=none
          if [ -f "$RUNNER_TEMP"/previous/pointer.json ]; then
            previous="$RUNNER_TEMP"/previous/pointer.json
          fi
          mkdir "$RUNNER_TEMP"/pointer
          uv run --frozen --no-dev scenario-tools channel pointer "$RUNNER_TEMP"/release/manifest.json --previous "$previous" --out "$RUNNER_TEMP/pointer/${CHANNEL}.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          default=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          head=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${default}" --jq .commit.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "The default branch moved to $head while the release was built from $GITHUB_SHA: release again."
            exit 1
          fi
          release=$(jq -r .release "$RUNNER_TEMP/pointer/${CHANNEL}.json")
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release}" > /dev/null 2> "$RUNNER_TEMP"/tag-error.txt; then
            echo "The tag $release exists: a release is never replaced."
            exit 1
          elif ! grep -q "Not Found (HTTP 404)" "$RUNNER_TEMP"/tag-error.txt; then
            cat "$RUNNER_TEMP"/tag-error.txt
            exit 1
          fi
          gh release create "$release" "$RUNNER_TEMP"/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$release" --notes "Release $release of the catalogue, on $CHANNEL. Check it against its manifest before using it: see docs/consumers.md."
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release}" --jq .object.sha)
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "The release $release is tagged on $tagged, not $GITHUB_SHA: the channel does not move to it."
            exit 1
          fi
          mkdir "$RUNNER_TEMP"/published
          gh release download "$release" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP"/published

      - name: Check the published release against the next pointer
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          uv run --frozen --no-dev scenario-tools channel previous --pointer "$RUNNER_TEMP/pointer/${CHANNEL}.json" --manifest "$RUNNER_TEMP"/published/manifest.json --channel "$CHANNEL"
          uv run --frozen --no-dev scenario-tools verify "$RUNNER_TEMP"/published/manifest.json --schemas schemas --approved

      - name: Take a token of the release app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Move the channel to the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          release=$(jq -r .release "$RUNNER_TEMP/pointer/${CHANNEL}.json")
          sha=""
          if [ -f "$RUNNER_TEMP"/previous/pointer.sha ]; then
            sha=$(cat "$RUNNER_TEMP"/previous/pointer.sha)
          fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${CHANNEL}.json" -f branch=channels -f message="Move ${CHANNEL} to ${release}" -f content="$(base64 -w0 "$RUNNER_TEMP/pointer/${CHANNEL}.json")" ${sha:+-f sha="$sha"} > /dev/null

      - name: Say what was published
        run: |
          jq -r '"Published \(.release) on \(.channel): \(.items | length) scenario(s), \(.payloads | length) payload version(s), approved by \(.release_approver)."' "$RUNNER_TEMP"/release/manifest.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.items[] | select(.approvals.approvers == []) | "- \(.name) \(.version): pull request #\(.approvals.pull_request), merged without approval (REL-002)"' "$RUNNER_TEMP"/release/manifest.json >> "$GITHUB_STEP_SUMMARY"
