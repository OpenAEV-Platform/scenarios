name: Release build

# Builds the release of the catalogue twice, on two runners, from the same commit, and compares
# the two byte for byte: a release is what its commit gives, wherever it is built. It publishes
# nothing yet. Run by hand. What the tools write stays beside the checkout, never in it.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: The channel to build the release for
        type: choice
        options: [edge, stable]
        default: edge

permissions:
  contents: read

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  approvals:
    name: Approvals of every entry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that reads more than the code: the pull requests and their reviews, read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Build from the default branch only
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Compared by the shell, as git names refs: case counts, where an expression ignores it.
        run: |
          if [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "A release is built from the default branch, whose changes were reviewed."
            exit 1
          fi

      - name: Build only the first release, until releases are published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq length)
          if [ "$count" != "0" ]; then
            echo "The repository has a release: the next one needs the previous manifest, which the release workflow does not read yet."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the last commit that changed each entry
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Collect the approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen --no-dev scenario-tools approvals --repo . --out ../approvals.json

      - name: Keep the approvals for the builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approvals
          path: ../approvals.json
          if-no-files-found: error
          retention-days: 7

  # Two jobs, the same but for the name of what they keep, rather than a matrix: an expression
  # is given to an action only to name a commit. A test keeps them the same.
  build-one:
    name: Build, first runner
    needs: approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the approvals
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approvals
          path: ../inputs

      - name: Build the release
        env:
          CHANNEL: ${{ inputs.channel }}
        run: >-
          uv run --frozen --no-dev scenario-tools build --repo . --previous-release none
          --channel "$CHANNEL" --approvals ../inputs/approvals.json
          --out ../release

      - name: Keep the release built
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-one
          path: ../release
          if-no-files-found: error
          retention-days: 7

  build-two:
    name: Build, second runner
    needs: approvals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the approvals
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approvals
          path: ../inputs

      - name: Build the release
        env:
          CHANNEL: ${{ inputs.channel }}
        run: >-
          uv run --frozen --no-dev scenario-tools build --repo . --previous-release none
          --channel "$CHANNEL" --approvals ../inputs/approvals.json
          --out ../release

      - name: Keep the release built
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-two
          path: ../release
          if-no-files-found: error
          retention-days: 7

  compare:
    name: The two builds are the same bytes, and the release is verified
    needs: [build-one, build-two]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Take the first build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-one
          path: ../one

      - name: Take the second build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-two
          path: ../two

      - name: Compare them byte for byte
        run: |
          diff --recursive --brief --no-dereference ../one ../two
          echo "The two builds are the same: $(find ../one -type f | wc -l) files." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the release as its consumers will
        run: uv run --frozen --no-dev scenario-tools verify ../one/manifest.json --schemas schemas
