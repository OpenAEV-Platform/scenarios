# Fast checks before every commit. Local hooks only: no hook code is fetched from the network.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: lint-imports
        name: import contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --no-banner --redact
        language: system
        pass_filenames: false
