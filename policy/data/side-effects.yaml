# Commands that write, create or start something (POL-005): a payload whose command, arguments
# or prerequisites take one needs a cleanup command that undoes it. Read-only commands need
# none. Each command is a list of steps, found as the forbidden actions are.
commands:
  - ['\b(copy|xcopy|robocopy|move|expand|cp|mv|ren|ln|mklink|copy-item|move-item|rename-item|expand-archive|compress-archive|unzip)\b']
  - ['\b(new-item|set-content|add-content|out-file|tee-object|tee|set-itemproperty|new-itemproperty)\b|\[(system\.)?io\.file\]::write']
  - ['\b(new-service|register-scheduledtask|new-scheduledtask|new-localuser|add-localgroupmember)\b']
  - ['\bsc(\.exe)?\b', '\bcreate\b']
  - ['\breg(\.exe)?\s+(add|import|copy|load|save|export)\b']
  - ['\bschtasks(\.exe)?\b', '\s/(create|change)\b']
  - ['\bwmic(\.exe)?\b', '\bprocess\s+call\s+create\b']
  - ['\b(psexec(64)?|msiexec|regsvr32|rundll32|certutil|bitsadmin)(\.exe)?\b|\bstart-bitstransfer\b']
  - ['\bnet(\.exe)?\s+(user|localgroup|group)\b', '\s/add\b']
  - ['\bnet(\.exe)?\s+start\b|\b(start-process|start-service|restart-service)\b|\blaunchctl\s+load\b']
  - ['\bsystemctl\b', '\s(start|enable|restart|reload)\b']
  - ['\bservice\b', '\s(start|restart|reload)\b']
  - ['\b(mkdir|md|touch|chmod|chown|icacls|takeown|useradd|usermod|install)\b|\bcrontab\b(?!\s+-l\b)']
  - ['\bsed\b', '\s-\w{0,10}i\b']
  - ['\btar\b', '\s-?\w{0,10}x']
  - ['\b(invoke-webrequest|iwr|irm|invoke-restmethod)\b', '\s-o(utfile)?\b']
  - ['\b(curl|wget)\b', '\s((-[a-z]{0,10}o|--output)(=|\s?)(?!/dev/null\b|-(\s|$))\S|--remote-name(-all)?\b)']
  - ['\bwget\b(?!.{0,300}--spider)']
  - ['(^|[^<>])\d?>{1,2}+\s*+(?!\$null|nul\b|/dev/null|&)\S']
