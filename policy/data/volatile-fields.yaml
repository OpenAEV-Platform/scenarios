# Fields removed from an export by normalisation: they change from one export or one instance
# to the next, and the importer does not read them. Keys are removed wherever they appear.
removed:
  - injector_contract_injectors
  - injector_contract_injector_names
  - injector_contract_payload_author
  - injector_contract_payload_author_organization
  - listened
removed_suffixes:
  - _created_at
  - _updated_at
# Lists whose order carries no meaning: they are sorted, so that two exports of the same
# scenario give the same file.
sorted:
  - inject_documents
  - inject_tags
  - inject_teams
  - injector_contract_attack_patterns
  - injector_contract_domains
  - injector_contract_platforms
  - payload_tags
  - team_tags
