# has the same identifier on every instance; the copy an export carries is never read for these
# facts. Recorded from the platform's own definition of each contract; recorded again when the
# targeted version changes. A scenario that uses another built-in contract needs it added here,
# in identifier order. copy_sha256 is the SHA-256 of the canonical form (RFC 8785) of the
# contract's normalised copy, as the platform exports it: an instance that lacks the contract
# builds it from the copy, so a scenario must carry this one.
