[project]
name = "openaev-scenario-tools"
dynamic = ["version"]
description = "Tools to prepare, check, release and verify OpenAEV scenarios."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",
    "jsonschema>=4.26,<5",
    "pyyaml>=6.0.3,<7",
    "referencing>=0.37,<0.38",
    "rfc3339-validator>=0.1.4,<0.2",
    "rfc3986-validator>=0.1.1,<0.2",
    "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
scenario-tools = "scenario_tools.interface.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.5",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.25",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
required-version = "==0.12.23"
# Exact versions of the build backend and its dependencies, recorded in uv.lock,
# so that every build, frozen installs included, uses the same tested versions.
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "tomlkit==0.15.1",
    "trove-classifiers==2026.9.21.13",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/scenario_tools/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scenario_tools"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N", "C4", "PTH", "ERA", "BLE", "A",
    "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.importlinter]
root_package = "scenario_tools"

[[tool.importlinter.contracts]]
name = "Hexagonal layers: dependencies point inwards"
type = "layers"
layers = [
    "scenario_tools.interface",
    "scenario_tools.adapters",
    "scenario_tools.application",
    "scenario_tools.ports",
    "scenario_tools.domain",
]

[[tool.importlinter.contracts]]
name = "Adapters do not call use cases or the interface"
type = "forbidden"
source_modules = ["scenario_tools.adapters"]
forbidden_modules = ["scenario_tools.application", "scenario_tools.interface"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mutmut]
# The whole package is copied so that the tests can import it; only the policy and
# verification contexts are mutated, everything else is excluded below.
source_paths = ["src/"]
do_not_mutate = [
    "*/scenario_tools/__init__.py",
    "*/scenario_tools/interface/*",
    "*/scenario_tools/application/*",
    "*/scenario_tools/ports/*",
    "*/scenario_tools/adapters/*",
    "*/scenario_tools/domain/__init__.py",
    "*/scenario_tools/domain/shared/*",
    "*/scenario_tools/domain/catalogue/*",
    "*/scenario_tools/domain/release/*",
    "*/scenario_tools/domain/lab/*",
]
# Mutants are judged by the domain tests only; the architecture tests would reject
# the instrumentation mutmut injects into the copied sources.
pytest_add_cli_args_test_selection = ["tests/domain/"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["scenario_tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
